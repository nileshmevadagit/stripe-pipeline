# dbt connection to the local DuckDB warehouse. No secrets here.
# Run from the repo root with: DBT_PROFILES_DIR=. uv run dbt build
stripe_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/warehouse/warehouse.duckdb
      schema: main
      threads: 1
    # V4 demo: Databricks Free Edition. Needs the dbt-databricks adapter (not in pyproject).
    # Set DATABRICKS_HOST, DATABRICKS_HTTP_PATH, and DATABRICKS_TOKEN in the shell. Nothing is stored here.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: workspace
      schema: stripe_pipeline
      threads: 1
