# Job file for Stripe test mode. Needs a test-mode key in STRIPE_TEST_KEY
# (sk_test_... or a read-only rk_test_... key). Never put the key in this file.
# Run it through scripts/run_extract.sh, which fills in the run date.
# Writes one JSON line per record into data/raw/<endpoint>/dt=<run date>/.
# __DT__ is replaced with the run date by scripts/run_extract.sh.
apis:
  stripe:
    base_url: https://api.stripe.com/v1
    auth:
      type: bearer
      token: ${STRIPE_TEST_KEY}
    endpoints:
      customers:
        method: GET
        path: /customers
        params: {limit: 100}
        pagination: {type: has_more, items_path: data}
      products:
        method: GET
        path: /products
        params: {limit: 100}
        pagination: {type: has_more, items_path: data}
      prices:
        method: GET
        path: /prices
        params: {limit: 100}
        pagination: {type: has_more, items_path: data}
      subscriptions:
        method: GET
        path: /subscriptions
        params: {limit: 100, status: all}
        pagination: {type: has_more, items_path: data}
      invoices:
        method: GET
        path: /invoices
        params: {limit: 100}
        pagination: {type: has_more, items_path: data}
      charges:
        method: GET
        path: /charges
        params: {limit: 100}
        pagination: {type: has_more, items_path: data}

jobs:
  customers:
    api: stripe
    endpoint: customers
    output: data/raw/customers/dt=__DT__/customers.jsonl
  products:
    api: stripe
    endpoint: products
    output: data/raw/products/dt=__DT__/products.jsonl
  prices:
    api: stripe
    endpoint: prices
    output: data/raw/prices/dt=__DT__/prices.jsonl
  subscriptions:
    api: stripe
    endpoint: subscriptions
    output: data/raw/subscriptions/dt=__DT__/subscriptions.jsonl
  invoices:
    api: stripe
    endpoint: invoices
    output: data/raw/invoices/dt=__DT__/invoices.jsonl
  charges:
    api: stripe
    endpoint: charges
    output: data/raw/charges/dt=__DT__/charges.jsonl
